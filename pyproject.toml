[project]
name = "ledgerkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prathamesh Thorat", email = "thoratprathamesh052@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.148.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.x is incompatible with bcrypt>=4.1's stricter API
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "redis>=5.0.8",
    "arq>=0.26.0",
    "python-json-logger>=2.0.7",
    "httpx>=0.27.0",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[project.scripts]
ledgerkit = "ledgerkit:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
